name: Security & Secret Scan

on:
  push:
    branches: ["main", "**"]
  pull_request:
    branches: ["main", "**"]

jobs:
  secret-scan:
    name: Detect Leaked Keys & Env Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run repository secret scanner
        run: node scripts/check-secrets.mjs
