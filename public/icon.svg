<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f16"/>
      <stop offset="50%" stop-color="#062e22"/>
      <stop offset="100%" stop-color="#0a0f16"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Base -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="98" fill="none" stroke="url(#emerald)" stroke-width="6" opacity="0.45"/>
  <rect x="26" y="26" width="460" height="460" rx="86" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.3"/>
  
  <!-- Main Raffle Ticket Shape -->
  <g filter="url(#glow)" transform="translate(66, 116)">
    <!-- Ticket Body with notches -->
    <path d="M 35 0 L 345 0 C 364 0 380 16 380 35 L 380 100 C 358 100 340 118 340 140 C 340 162 358 180 380 180 L 380 245 C 380 264 364 280 345 280 L 35 280 C 16 280 0 264 0 245 L 0 180 C 22 180 40 162 40 140 C 40 118 22 100 0 100 L 0 35 C 0 16 16 0 35 0 Z" 
          fill="#0c161d" stroke="url(#gold)" stroke-width="6"/>
    
    <!-- Vertical dashed perforated divider line -->
    <line x1="265" y1="20" x2="265" y2="260" stroke="#34d399" stroke-width="4" stroke-dasharray="10,10" opacity="0.6"/>
    
    <!-- Golden Star in ticket -->
    <path d="M 132 46 L 144 82 L 182 82 L 151 104 L 163 140 L 132 118 L 101 140 L 113 104 L 82 82 L 120 82 Z" fill="url(#gold)"/>
    
    <!-- Title and Subtitle -->
    <text x="132" y="195" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">SORTEOS</text>
    <text x="132" y="230" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="6">PREMIUM</text>
    
    <!-- Right stub VIP text -->
    <g transform="translate(322, 140) rotate(90)">
      <text x="0" y="8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="url(#gold)" text-anchor="middle" letter-spacing="4">VIP</text>
    </g>
  </g>
</svg>